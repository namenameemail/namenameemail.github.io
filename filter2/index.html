<!doctype html>
<html lang="en-us">
  <head>
    <script src="coi-serviceworker.js"></script>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>filter2309</title>
    <link rel="stylesheet" type="text/css" href="style.css">
  </head>
  <body>
    <div class="spinner" id='spinner'></div>
    <div class="emscripten" id="status">Downloading...</div>
    <div class="emscripten"><progress value="0" max="100" id="progress" hidden=1></progress></div>
    <div class="emscripten_border">
      <canvas class="emscripten" id="canvas" tabindex=-1></canvas>
    </div>
    <textarea id="output" rows="8"></textarea>
    <script>
      (function () {
        var canvas = document.getElementById('canvas');
        function fit() {
          var w = Math.max(1, Math.round(window.innerWidth));
          var h = Math.max(1, Math.round(window.innerHeight));
          var sw = w + 'px';
          var sh = h + 'px';
          if (canvas.style.width !== sw) canvas.style.width = sw;
          if (canvas.style.height !== sh) canvas.style.height = sh;
          if (canvas.width !== w || canvas.height !== h) {
            canvas.width = w;
            canvas.height = h;
          }
        }
        function tick() {
          fit();
          requestAnimationFrame(tick);
        }
        tick();
      })();
    </script>
    <script async type="text/javascript" src="app.js"></script>
    <script async type="text/javascript" src="index.js"></script>
  </body>
</html>
